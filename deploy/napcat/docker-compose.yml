services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat-server
    restart: unless-stopped
    ports:
      - "3001:3001"   # OneBot v11 正向 WebSocket 端口
      - "6099:6099"   # NapCat WebUI 后台管理面板端口
    environment:
      - MODE=ws
      - WEBUI_TOKEN=dafeiyu888
    volumes:
      - ./data/qq:/app/.config/QQ
      - ./data/config:/app/napcat/config
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
